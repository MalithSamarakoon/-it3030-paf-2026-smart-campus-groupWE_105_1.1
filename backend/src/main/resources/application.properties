spring.application.name=backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/paf?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

smartcampus.app.jwtSecret=YourSuperSecretKeyForSmartCampus2026OperationsHub!!
smartcampus.app.jwtExpirationMs=86400000

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.file.upload-dir=uploads
spring.web.resources.static-locations=file:${app.file.upload-dir}
